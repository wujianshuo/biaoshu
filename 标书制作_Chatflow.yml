              id: "b222d11b-3d16-512d-aa1d-533ae1774646"
              role: "user"
              text: |2-
                <格式要求>
                {{#1050.format_requirements#}}
                </格式要求>
                <评分细则及强制条款>
                {{#1050.score#}}
                </评分细则及强制条款>
                <项目要求>
