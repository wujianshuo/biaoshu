      description: "飞书自建应用 App ID，留空时仅使用聊天输出。"
      selector: ["env", "FEISHU_APP_ID"]
      value_type: "secret"
      value: ""
    -
      id: "eb73d619-89bf-5986-9066-aaf7ba5e4fef"
      name: "FEISHU_APP_SECRET"
      description: "飞书自建应用 App Secret，留空时仅使用聊天输出。"
      selector: ["env", "FEISHU_APP_SECRET"]
      value_type: "secret"
      value: ""
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: ["local_file", "remote_url"]
    opening_statement: "请在开始表单上传一份招标文件。需要写入飞书时，填写已有的飞书新版云文档链接，然后发送“开始生成标书”。"
    suggested_questions: ["开始生成标书"]
    suggested_questions_after_answer:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
