            import re


            def main(outline: str, text: str) -> dict:
                text = re.sub(r'^\s*<think>.*?</think>\s*', '', text, count=1, flags=re.S).strip()
                fence = re.fullmatch(r'```(?:markdown|md)?[ \t]*\n(.*?)\n```', text, re.S | re.I)
                if fence:
                    text = fence.group(1).strip()
                title = outline.splitlines()[0]
                lines = text.splitlines()
                if not lines or lines[0].strip() != title or not any(line.strip() for line in lines[1:]):
