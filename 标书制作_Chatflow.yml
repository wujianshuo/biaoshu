                </项目要求>
                <招标文件原文>
                {{#1020.text#}}
                </招标文件原文>
                请输出包含一级标题数组的 JSON 对象。
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          reasoning_format: "separated"
        position:
          x: 1800
          y: 100
        positionAbsolute:
          x: 1800
          y: 100
        sourcePosition: "right"
        targetPosition: "left"
        selected: false
        width: 250
        height: 90
      -
        id: "1070"
        type: "custom"
        data:
          type: "code"
          title: "整理一级标题数组"
          desc: ""
          selected: false
          code_language: "python3"
          code: |2
            import json
            import re


            def parse_object(text, node_name):
                text = re.sub(r'^\s*<think>.*?</think>\s*', '', text, count=1, flags=re.S).strip()
                fence = re.fullmatch(r'```(?:json)?\s*(.*?)\s*```', text, re.S | re.I)
                if fence:
                    text = fence.group(1)
                try:
                    value = json.loads(text)
                except ValueError:
                    raise ValueError(node_name + '未返回完整 JSON，请检查模型输出和最大输出长度。') from None
                if not isinstance(value, dict):
                    raise ValueError(node_name + '应返回一个 JSON 对象。')
                return value


            def main(text: str) -> dict:
                chapters = parse_object(text, '一级框架节点').get('chapters')
                if not isinstance(chapters, list) or not chapters:
                    raise ValueError('一级框架为空，请检查文件提取文本或模型输出。')
                if any(not isinstance(title, str) or not title.strip() or len(title) > 600 or '\n' in title.strip() for title in chapters):
                    raise ValueError('一级目录每项应是一个非空、单行的标题。')
                chapters = [title.strip().lstrip('#').strip() for title in chapters]
                if not all(chapters) or len(chapters) != len(set(chapters)):
                    raise ValueError('一级目录含空标题或重复标题，请重试。')
                return {'chapters': chapters}
          variables:
            -
              variable: "text"
              value_selector: ["1060", "text"]
          outputs:
            chapters:
              type: "array[string]"
              children: null
