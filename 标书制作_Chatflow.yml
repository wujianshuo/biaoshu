                    raise ValueError(f"飞书{action}失败（HTTP {status_code}，业务码 {display_code}）。")
                return response


            def main(body: str, status_code: int) -> dict:
                response = checked_response(body, status_code, "转换 Markdown，请检查云文档块转换权限及正文格式")
                data = response.get("data")
                if not isinstance(data, dict):
                    raise ValueError("飞书 Markdown 转换未返回可写入的数据。")
                roots = data.get("first_level_block_ids")
                blocks = data.get("blocks")
                if not isinstance(roots, list) or not roots or not isinstance(blocks, list) or not blocks:
                    raise ValueError("飞书 Markdown 转换未返回可写入的文档块。")
                if len(blocks) > 1000:
                    raise ValueError("单章转换后超过飞书单次写入的 1,000 个文档块上限，请拆短该章节。")

                for block in blocks:
                    if not isinstance(block, dict) or not isinstance(block.get("block_id"), str):
                        raise ValueError("飞书 Markdown 转换返回了无效的文档块。")
                    if block.get("block_type") == 27:
                        raise ValueError("章节包含图片，请将其改为文字说明后再同步到飞书。")
                    table = block.get("table")
                    if isinstance(table, dict) and isinstance(table.get("property"), dict):
                        table["property"].pop("merge_info", None)

                ids = {block["block_id"] for block in blocks}
                if len(ids) != len(blocks) or any(not isinstance(root, str) or root not in ids for root in roots):
                    raise ValueError("飞书 Markdown 转换返回了无效的文档块引用。")
                payload = {"children_id": roots, "descendants": blocks, "index": -1}
                return {
                    "request_body": json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
                    "client_token": str(uuid4()),
                    "root_count": len(roots),
                }
