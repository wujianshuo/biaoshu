                针对当前一级标题细化本章的二级标题。按招标文件明示的标题、范围、要求和顺序，其他子节覆盖本章相关评分点。只给目录。首行必须是“# ”加当前一级标题，后续用“## ”加每条二级标题，每行一个标题。若招标文件规定了固定表单或明确禁止细分，就只保留一级标题。一级标题文字不得改写。
