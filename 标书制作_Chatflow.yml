                expected = [line.strip() for line in outline.splitlines()[1:] if line.startswith('## ')]
                actual = [line.strip() for line in lines[1:] if line.strip().startswith('## ')]
                if actual != expected:
                    raise ValueError('本章二级标题与目录不一致，请检查模型是否改写标题或因输出长度截断：' + title)
                return {'chapter': text}
