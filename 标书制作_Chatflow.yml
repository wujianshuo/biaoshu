          code_language: "python3"
          code: |2
            import re


            def main(title: str, text: str) -> dict:
                lines = re.sub(r'^\s*<think>.*?</think>\s*', '', text, count=1, flags=re.S).strip().splitlines()
                headings = [line.strip() for line in lines if re.match(r'^#{1,2}\s+\S', line.strip())]
                if not headings or headings[0].lstrip('#').strip() != title:
                    raise ValueError('生成的二级框架缺少或改写了一级标题：' + title)
                children = [line for line in headings[1:] if line.startswith('## ')]
                return {'outline': '\n'.join(['# ' + title, *children])}
          variables:
