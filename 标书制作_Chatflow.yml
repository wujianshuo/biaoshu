app:
  name: "标书制作 · 招标文件到飞书"
  mode: "advanced-chat"
  icon: "📑"
  icon_background: "#E6F1FF"
  use_icon_as_answer_icon: false
  description: "上传招标文件，提取格式与评分要求，按一级、二级框架逐章生成标书，并可追加到飞书文档。"
dependencies: []
kind: "app"
version: "0.3.1"
