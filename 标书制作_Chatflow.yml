            import re
            from urllib.parse import urlsplit


            def main(document: str) -> dict:
                raw = (document or "").strip()
                token_format = r"[A-Za-z0-9_-]{5,128}"
                if re.fullmatch(token_format, raw):
                    return {"doc_token": raw, "doc_url": "https://www.feishu.cn/docx/" + raw}

                try:
                    url = urlsplit(raw)
                except ValueError:
                    raise ValueError("目标文档请填写飞书新版云文档的 /docx/ 链接或文档 token。") from None
                if url.scheme == "https" and re.fullmatch(r"(?:[a-z0-9-]+\.)*feishu\.cn", url.netloc):
                    path = re.fullmatch(r"/docx/(" + token_format + r")/?", url.path)
                    if path:
                        token = path.group(1)
                        return {"doc_token": token, "doc_url": f"https://{url.netloc}/docx/{token}"}
                raise ValueError("目标文档请填写飞书新版云文档的 /docx/ 链接或文档 token。")
