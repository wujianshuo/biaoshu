app:
  name: "WF04 评标办法分析"
  description: "从已审核的招标解析结果生成评分响应矩阵。"
  mode: "workflow"
  icon: "📋"
  icon_background: "#EDF4FF"
  use_icon_as_answer_icon: false
kind: "app"
version: "0.3.1"
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
    -
      id: "29f20cfa-3495-5bd3-8ff3-2d5d6772853c"
      name: "BIAOSHU_API_BASE"
      selector: ["env", "BIAOSHU_API_BASE"]
      value_type: "string"
      description: "企业内网业务 API 基址，不带 /v1"
      value: ""
    -
      id: "2eadf1d7-be6f-5bfe-8837-11388bddc56f"
      name: "BIAOSHU_API_TOKEN"
      selector: ["env", "BIAOSHU_API_TOKEN"]
      value_type: "secret"
      description: "业务服务授权令牌，在 Dify 中填写"
      value: ""
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    viewport:
      x: 0
      y: 40
      zoom: 0.64
    nodes:
      -
        id: "start"
        type: "custom"
        position:
          x: 70
          y: 100
        positionAbsolute:
          x: 70
          y: 100
        sourcePosition: "right"
        targetPosition: "left"
        width: 244
        height: 90
        selected: false
        data:
          type: "start"
          title: "项目和执行参数"
          desc: ""
          selected: false
          variables:
            -
              label: "项目 ID"
              variable: "project_id"
              type: "text-input"
              max_length: 100
              required: true
              options: []
              default: ""
            -
              label: "工作流参数 JSON"
              variable: "request_json"
              type: "paragraph"
              max_length: 12000
              required: false
              options: []
              default: "{}"
      -
        id: "prepare"
        type: "custom"
        position:
          x: 390
          y: 100
        positionAbsolute:
          x: 390
          y: 100
        sourcePosition: "right"
        targetPosition: "left"
        width: 244
        height: 90
        selected: false
        data:
          type: "code"
          title: "校验输入并生成请求"
          desc: ""
          selected: false
          code_language: "python3"
          code: |2
            PROJECT_REQUIRED = True
            FIELDS = {}

            from datetime import date
            import json
            import re
            from urllib.parse import urlsplit


            def unique_object(items):
                result = {}
                for key, value in items:
                    if key in result:
                        raise ValueError("请求 JSON 存在重复的字段")
                    result[key] = value
                return result


            def reject_constant(value):
                raise ValueError("请求 JSON 不支持非有限数值")


            def main(project_id: str, request_json: str, api_base: str) -> dict:
                base = (api_base or "").strip().rstrip("/")
                uri = urlsplit(base)
                if uri.scheme not in ("http", "https") or not uri.hostname or uri.username is not None or uri.query or uri.fragment:
                    raise ValueError("请在 Dify 环境变量填写内网 BIAOSHU_API_BASE，例如 http://biaoshu-api:8091")
                if any(char.isspace() for char in base):
                    raise ValueError("BIAOSHU_API_BASE 不能包含空白字符")
                project_id = (project_id or "").strip()
                if (project_id or PROJECT_REQUIRED) and not re.fullmatch(r"[A-Za-z0-9_-]{1,100}", project_id):
                    raise ValueError("请填写可用的 project_id")
                try:
                    payload = json.loads((request_json or "").strip() or "{}",
                                         object_pairs_hook=unique_object, parse_constant=reject_constant)
                except json.JSONDecodeError as exc:
                    raise ValueError(f"request_json 不是有效 JSON，第 {exc.lineno} 行第 {exc.colno} 列") from None
                if not isinstance(payload, dict):
                    raise ValueError("request_json 必须是 JSON 对象，例如 {}")
                if any(key not in FIELDS for key in payload):
                    raise ValueError("request_json 有不支持的字段，请查看工作流输入说明")
                for key, value in payload.items():
                    kind = FIELDS[key]
                    if kind == "id_list" and (not isinstance(value, list) or any(
                        not isinstance(item, str) or not item.strip() for item in value
                    )):
                        raise ValueError(f"{key} 必须是非空 ID 字符串组成的数组")
                    if kind == "string" and (not isinstance(value, str) or not value.strip()):
                        raise ValueError(f"{key} 必须是非空字符串")
                    if kind == "document_kinds" and (not isinstance(value, dict) or any(
                        not name.strip() or category not in ("tender", "amendment", "drawing", "boq", "template", "other")
                        for name, category in value.items()
                    )):
                        raise ValueError("document_kinds 必须以文件名为键，值为招标资料类别")
                    if kind == "date":
                        try:
                            if not isinstance(value, str) or not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", value):
                                raise ValueError
                            date.fromisoformat(value)
                        except ValueError:
                            raise ValueError(f"{key} 必须是 yyyy-mm-dd 格式的有效日期") from None
                    if kind == "mode" and value not in ("draft", "reviewed"):
                        raise ValueError("mode 仅可填写 draft 或 reviewed")
                    if kind == "bool" and type(value) is not bool:
                        raise ValueError(f"{key} 应填写 true 或 false")
                return {
                    "url_base": base,
                    "project_id": project_id,
                    "payload_json": json.dumps(payload, ensure_ascii=False),
                    "request_body": json.dumps({**payload, "project_id": project_id or None}, ensure_ascii=False),
                }
          variables:
            -
              variable: "project_id"
              value_selector: ["start", "project_id"]
            -
              variable: "request_json"
              value_selector: ["start", "request_json"]
            -
              variable: "api_base"
              value_selector: ["env", "BIAOSHU_API_BASE"]
          outputs:
            url_base:
              type: "string"
              children: null
            project_id:
              type: "string"
              children: null
            payload_json:
              type: "string"
              children: null
            request_body:
              type: "string"
              children: null
      -
        id: "http_run"
        type: "custom"
        position:
          x: 1120
          y: 100
        positionAbsolute:
          x: 1120
          y: 100
        sourcePosition: "right"
        targetPosition: "left"
        width: 244
        height: 90
        selected: false
        data:
          type: "http-request"
          title: "调用内网业务工作流"
          desc: ""
          selected: false
          method: "post"
          url: "{{#prepare.url_base#}}/v1/workflows/WF04/run"
          headers: "Accept: application/json"
          params: ""
          body:
            type: "json"
            data:
              -
                id: "5caf3fff-fcb0-57e1-95fd-f16026879c6e"
                key: ""
                type: "text"
                value: "{{#prepare.request_body#}}"
                file: []
          authorization:
            type: "api-key"
            config:
              type: "bearer"
              header: "Authorization"
              api_key: "{{#env.BIAOSHU_API_TOKEN#}}"
          timeout:
            connect: 10
            read: 60
            write: 60
          ssl_verify: true
          retry_config:
            retry_enabled: false
            max_retries: 0
            retry_interval: 1000
      -
        id: "status_run"
        type: "custom"
        position:
          x: 1440
          y: 100
        positionAbsolute:
          x: 1440
          y: 100
        sourcePosition: "right"
        targetPosition: "left"
        width: 244
        height: 90
        selected: false
        data:
          type: "code"
          title: "识别业务状态"
          desc: ""
          selected: false
          code_language: "python3"
          code: |2
            import json


            def main(body: str, http_status: int) -> dict:
                try:
                    value = json.loads(body)
                except (TypeError, ValueError):
                    value = None
                if not 200 <= http_status < 300:
                    status = "backend_error"
                elif not isinstance(value, dict):
                    status = "invalid_response"
                else:
                    label = value.get("status")
                    status = label.strip()[:120] if isinstance(label, str) and label.strip() else "ok"
                return {"status": status}
          variables:
            -
              variable: "body"
              value_selector: ["http_run", "body"]
            -
              variable: "http_status"
              value_selector: ["http_run", "status_code"]
          outputs:
            status:
              type: "string"
              children: null
      -
        id: "end_run"
        type: "custom"
        position:
          x: 1760
          y: 100
        positionAbsolute:
          x: 1760
          y: 100
        sourcePosition: "right"
        targetPosition: "left"
        width: 244
        height: 90
        selected: false
        data:
          type: "end"
          title: "输出执行结果"
          desc: ""
          selected: false
          outputs:
            -
              variable: "result_json"
              value_type: "string"
              value_selector: ["http_run", "body"]
            -
              variable: "status"
              value_type: "string"
              value_selector: ["status_run", "status"]
            -
              variable: "http_status"
              value_type: "number"
              value_selector: ["http_run", "status_code"]
    edges:
      -
        id: "start-source-prepare-target"
        source: "start"
        sourceHandle: "source"
        target: "prepare"
        targetHandle: "target"
        type: "custom"
        zIndex: 0
        data:
          sourceType: "start"
          targetType: "code"
          isInIteration: false
          isInLoop: false
      -
        id: "prepare-source-http_run-target"
        source: "prepare"
        sourceHandle: "source"
        target: "http_run"
        targetHandle: "target"
        type: "custom"
        zIndex: 0
        data:
          sourceType: "code"
          targetType: "http-request"
          isInIteration: false
          isInLoop: false
      -
        id: "http_run-source-status_run-target"
        source: "http_run"
        sourceHandle: "source"
        target: "status_run"
        targetHandle: "target"
        type: "custom"
        zIndex: 0
        data:
          sourceType: "http-request"
          targetType: "code"
          isInIteration: false
          isInLoop: false
      -
        id: "status_run-source-end_run-target"
        source: "status_run"
        sourceHandle: "source"
        target: "end_run"
        targetHandle: "target"
        type: "custom"
        zIndex: 0
        data:
          sourceType: "code"
          targetType: "end"
          isInIteration: false
          isInLoop: false
