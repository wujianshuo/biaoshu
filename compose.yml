name: biaoshu-mvp
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: biaoshu
      POSTGRES_USER: biaoshu
      POSTGRES_PASSWORD: ${BIAOSHU_POSTGRES_PASSWORD:?请先生成.env}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biaoshu -d biaoshu"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [data]
    restart: unless-stopped
  api:
    build:
      context: .
      args:
        WITH_OCR: "${BIAOSHU_WITH_OCR:-0}"
        WITH_PDF_EXPORT: "${BIAOSHU_WITH_PDF_EXPORT:-0}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIAOSHU_DATABASE_URL: "postgresql://biaoshu:${BIAOSHU_POSTGRES_PASSWORD}@postgres:5432/biaoshu"
      BIAOSHU_TOKENS_JSON: "${BIAOSHU_TOKENS_JSON:?请配置访问令牌}"
      BIAOSHU_FILE_ROOT: /data/objects
      BIAOSHU_UPLOAD_MB: "${BIAOSHU_UPLOAD_MB:-25}"
      BIAOSHU_MODEL_BASE_URL: "${BIAOSHU_MODEL_BASE_URL:-}"
      BIAOSHU_MODEL_NAME: "${BIAOSHU_MODEL_NAME:-}"
      BIAOSHU_MODEL_API_KEY: "${BIAOSHU_MODEL_API_KEY:-}"
      BIAOSHU_MODEL_TIMEOUT: "${BIAOSHU_MODEL_TIMEOUT:-90}"
      BIAOSHU_EMBEDDING_MODEL: "${BIAOSHU_EMBEDDING_MODEL:-}"
      BIAOSHU_STORAGE_BACKEND: "${BIAOSHU_STORAGE_BACKEND:-filesystem}"
      BIAOSHU_S3_ENDPOINT: "${BIAOSHU_S3_ENDPOINT:-}"
      BIAOSHU_S3_BUCKET: "${BIAOSHU_S3_BUCKET:-}"
      BIAOSHU_S3_ACCESS_KEY: "${BIAOSHU_S3_ACCESS_KEY:-}"
      BIAOSHU_S3_SECRET_KEY: "${BIAOSHU_S3_SECRET_KEY:-}"
      BIAOSHU_S3_REGION: "${BIAOSHU_S3_REGION:-us-east-1}"
      BIAOSHU_S3_CA_FILE: "${BIAOSHU_S3_CA_FILE:-}"
      BIAOSHU_OCR_BIN: "${BIAOSHU_OCR_BIN:-}"
      BIAOSHU_OCR_LANG: "${BIAOSHU_OCR_LANG:-chi_sim+eng}"
      BIAOSHU_SOFFICE_BIN: "${BIAOSHU_SOFFICE_BIN:-}"
    ports: ["127.0.0.1:${BIAOSHU_PORT:-8091}:8091"]
    volumes: [objects:/data/objects]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).close()"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [data, runtime]
    restart: unless-stopped
networks:
  data:
    internal: true
  runtime: {}
volumes:
  pg_data: {}
  objects: {}
